name: Windows

on:
  push:
    branches: [windows-port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Nebula's mod-tools only carries the macOS patcher. On Windows the upstream
      # cslol-tools build is used as is: same CLI, and its patcher ships as cslol-dll.dll.
      - name: Build mod-tools
        shell: bash
        run: |
          git clone https://github.com/LeagueToolkit/cslol-manager.git cslol
          git -C cslol checkout 23f230858bc2359ce279e07ed129d482fe3b00bf
          cmake -S cslol/cslol-tools -B cslol/build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build cslol/build --target mod-tools
          mkdir -p src-tauri/binaries
          cp cslol/build/mod-tools.exe src-tauri/binaries/mod-tools-x86_64-pc-windows-msvc.exe
          cp cslol/cslol-tools/vendor/cslol-patcher/cslol-dll.dll src-tauri/binaries/cslol-dll.dll

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build

      # Straight to a release: artifacts count against the account storage quota.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release create "v$VERSION-windows-${{ github.run_number }}" src-tauri/target/release/bundle/nsis/*.exe \
            --target "$GITHUB_SHA" \
            --title "Nebula v$VERSION (Windows)" \
            --notes "Windows installer. Unsigned, so SmartScreen may warn: More info > Run anyway."
